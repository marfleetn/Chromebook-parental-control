<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site not allowed</title>
<style>
  :root {
    --paper: #f7f4ee;
    --paper-2: #efeadd;
    --ink: #22201c;
    --ink-soft: #6b655b;
    --brass: #a07c2c;
    --corner: 3px;
  }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { max-width: 460px; width: 100%; }
  .kicker {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
  }
  h1 { font-size: 24px; font-weight: 600; margin: 6px 0 10px; }
  p { color: var(--ink-soft); margin: 0 0 18px; }
  .card {
    background: var(--paper-2);
    border: 1px solid #e3ddd0;
    border-radius: var(--corner);
    padding: 14px 16px;
    font-size: 13px;
  }
  .card .row { display: flex; justify-content: space-between; padding: 4px 0; }
  .card .k { color: var(--ink-soft); }
  .card .v { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
  footer { margin-top: 22px; font-size: 11px; color: var(--ink-soft); }
  .actions { margin-top: 16px; }
  button {
    font: inherit; font-size: 13px; padding: 8px 14px; cursor: pointer;
    background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: var(--corner);
  }
</style>
</head>
<body>
  <main>
    <div class="kicker">Family policy</div>
    <h1 id="title">This site&#8217;s not allowed right now</h1>
    <p id="lede">The family rules block this destination. If you&#8217;re a parent, check
       the console for the current rules.</p>
    <div class="card">
      <div class="row"><span class="k">Site</span>    <span class="v" id="url">&#8212;</span></div>
      <div class="row"><span class="k">Reason</span>  <span class="v" id="reason">blocked by policy</span></div>
      <div class="row"><span class="k">Time</span>    <span class="v" id="when">&#8212;</span></div>
    </div>
    <div class="actions"><button id="back">Go back</button></div>
    <footer>CHPC Family &middot; self-hosted</footer>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
