version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # react and react-dom must move together: a mismatched pair fails at runtime.
      react:
        patterns: ["react", "react-dom"]
      dev-toolchain:
        dependency-type: development
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Stay on even-numbered (LTS) Node images; odd releases are short-lived.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
