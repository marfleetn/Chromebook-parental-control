name: Security tests
# Adversarial test suite: authentication bypass attempts, injection and
# prototype pollution, information leaks, cross-child isolation, DoS limits,
# path traversal, rule-engine fail-closed and regex-safety invariants, and
# repository hygiene tripwires (manifest permissions, no phone-home, pinned
# actions, hardened container, dependency surface).
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
concurrency:
  group: security-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  security-tests:
    name: security-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:security
