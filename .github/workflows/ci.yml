name: Tests
# Runs on every pull request and every push. A PR cannot merge while any job
# here is red once the repository's branch ruleset requires these checks
# (see README → Continuous integration).
on:
  push:
    branches: ["**"]
  pull_request:
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit + integration tests with coverage thresholds (95% lines, 80% branches, 95% functions)
        run: npm run test:coverage
      - run: npm run build
      - name: Extension bundle is committed and current
        run: git diff --exit-code -- extension/vendor/core.js

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chpc:ci .
      - name: Container starts, prints a setup code and answers health
        run: |
          set -e
          docker run -d --name chpc-ci -p 4100:4100 chpc:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4100/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:4100/api/health | grep -q '"ok":true'
          docker logs chpc-ci | grep -q "Setup code"
          curl -s http://127.0.0.1:4100/api/setup/status | grep -q '"needsSetup":true'
          docker rm -f chpc-ci

  # Regenerates the README badge data (tests, coverage, vulnerabilities,
  # extension) on the `badges` branch after a green run on main.
  badges:
    name: badges
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/badges.mjs "$RUNNER_TEMP/badges"
      - name: Publish to the badges branch (data files only)
        run: |
          set -e
          # Work in an empty directory so node_modules and build output can never be committed.
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan badges
          cp "$RUNNER_TEMP"/badges/*.json .
          echo "Badge data regenerated by the Tests workflow from ${GITHUB_SHA::7}. Do not edit by hand." > README.md
          git add -A
          git commit -qm "badges: $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push --force origin badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
