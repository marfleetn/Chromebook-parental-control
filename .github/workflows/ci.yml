name: Tests
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Extension bundle is committed and current
        run: git diff --exit-code -- extension/vendor/core.js
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t chpc:ci .

  # Regenerates the data-driven README badges (test count, vulnerability count,
  # extension version) on the `badges` branch after a green run on main.
  badges:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/badges.mjs "$RUNNER_TEMP/badges"
      - name: Publish to the badges branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges 2>/dev/null && git checkout badges || git checkout --orphan badges
          git rm -rfq . 2>/dev/null || true
          cp "$RUNNER_TEMP"/badges/*.json .
          echo "Badge data regenerated by the Tests workflow. Do not edit by hand." > README.md
          git add -A
          git commit -qm "badges: $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}" || echo "no change"
          git push origin badges
