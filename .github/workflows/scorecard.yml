name: Scorecard
# OpenSSF Scorecard: independent scoring of supply-chain and project security
# practices (pinned dependencies, branch protection, token permissions, SAST,
# vulnerabilities, ...). Results publish to scorecard.dev and the Security tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 2"
  branch_protection_rule:
permissions: read-all
jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          sarif_file: results.sarif
