# CHPC — run at home:
#   cp .env.example .env   # set CHPC_GUARDIAN_PIN
#   docker compose up -d --build
# Console + API: http://<host>:4100
services:
  chpc:
    build: .
    image: chpc:latest
    container_name: chpc
    ports:
      - "4100:4100"
    environment:
      # Compose aborts with a clear message if the PIN is missing from .env.
      CHPC_GUARDIAN_PIN: ${CHPC_GUARDIAN_PIN:?set CHPC_GUARDIAN_PIN in .env (6+ characters)}
      CHPC_RETENTION_DAYS: ${CHPC_RETENTION_DAYS:-90}
      CHPC_TRUST_PROXY: ${CHPC_TRUST_PROXY:-0}
      CHPC_CORS_ORIGINS: ${CHPC_CORS_ORIGINS:-}
    volumes:
      - chpc-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  chpc-data:
    name: chpc-data
